<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal 多工作区</title>
<style>
:root{
  --bg:#0f1115;--panel:#151820;--panel2:#1c2029;--line:#2d3442;
  --text:#fff;--muted:#aeb6c5;--accent:#5865f2;--accent2:#7380ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 18px;background:#171a21;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0;flex:1}
button,input,select,textarea{font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover{background:var(--accent2)}
button.secondary{background:#252a35}
button.secondary:hover{background:#303745}
main{display:grid;grid-template-columns:270px 1fr 350px;min-height:calc(100vh - 58px)}
aside,.right{padding:14px;background:var(--panel);overflow:auto}
aside{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.card b{display:block;margin-bottom:4px}.muted{color:var(--muted);font-size:12px}
.work{padding:14px;overflow:auto}
.pane{background:#1a1e27;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input,select,textarea{width:100%;background:#0f1218;color:#fff;border:1px solid #343b4a;border-radius:8px;padding:9px}
textarea{min-height:180px;resize:vertical;margin-top:10px}
a.launch{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;border-radius:8px;padding:9px 12px}
.section-title{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted);margin-left:6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.notice{background:#131722;border:1px dashed #343b4a;border-radius:10px;padding:10px;color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:980px){main{grid-template-columns:1fr}.right,aside{border:0}.right{order:3}}
</style>
</head>
<body>
<header>
  <h1>Signal 多工作区 + 网页翻译</h1>
  <button onclick="addAccount()">添加 Signal 身份</button>
  <button class="secondary" onclick="addWeb()">添加网页</button>
</header>

<main>
  <aside>
    <div class="section-title">
      <h3>Signal 身份</h3>
      <span class="badge" id="accountCount">0</span>
    </div>
    <div id="accounts"></div>
    <div class="notice">
      浏览器网页不能直接创建多个独立 Signal 登录会话。这里用于管理多个 Signal 环境，
      保存每个账号对应的启动入口，例如远程桌面、自定义协议或其他你自己的运行环境。
    </div>
  </aside>

  <section class="work">
    <div class="section-title">
      <h3>网页工作区</h3>
      <span class="badge" id="webCount">0</span>
    </div>
    <div id="webs"></div>
  </section>

  <section class="right">
    <h3>翻译工具</h3>
    <div class="row">
      <select id="from">
        <option value="auto">自动识别</option>
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
      <select id="to">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </div>

    <textarea id="text" placeholder="粘贴需要翻译的内容……"></textarea>

    <div class="actions">
      <button onclick="translateText()">打开翻译</button>
      <button class="secondary" onclick="swapLang()">交换语言</button>
      <button class="secondary" onclick="copyText()">复制原文</button>
    </div>

    <div class="notice">
      翻译会在新标签页打开 Google Translate，这样可以绕过大部分浏览器跨域限制。
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);

let accounts = JSON.parse(localStorage.getItem('signal.accounts') || '[]');
let webs = JSON.parse(localStorage.getItem('signal.webs') || '[]');

function save(){
  localStorage.setItem('signal.accounts', JSON.stringify(accounts));
  localStorage.setItem('signal.webs', JSON.stringify(webs));
}

function safe(s){
  return String(s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function normalize(url){
  url = (url || '').trim();
  if(!url) return '';
  return /^[a-z][a-z0-9+.-]*:/i.test(url) ? url : 'https://' + url;
}

function renderAccounts(){
  $('#accountCount').textContent = accounts.length;
  const el = $('#accounts');
  if(!accounts.length){
    el.innerHTML = '<div class="muted">还没有添加 Signal 身份。</div>';
    return;
  }

  el.innerHTML = accounts.map((a,i) => `
    <div class="card">
      <b>${safe(a.name)}</b>
      <div class="muted">${safe(a.note || '未填写备注')}</div>
      <div class="actions">
        ${a.url ? `<a class="launch" href="${safe(normalize(a.url))}" target="_blank" rel="noopener noreferrer">启动</a>` : ''}
        <button class="secondary" onclick="editAccount(${i})">编辑</button>
        <button class="secondary" onclick="removeAccount(${i})">删除</button>
      </div>
    </div>
  `).join('');
}

function addAccount(){
  const name = prompt('这个 Signal 身份叫什么？例如：招聘账号');
  if(!name) return;
  const note = prompt('号码或备注（可留空）') || '';
  const url = prompt('启动地址（可留空）\n例如：远程桌面地址、自定义协议或你自己的管理入口') || '';
  accounts.push({name, note, url});
  save();
  renderAccounts();
}

function editAccount(i){
  const a = accounts[i];
  const name = prompt('名称', a.name);
  if(name === null || !name.trim()) return;
  const note = prompt('号码或备注', a.note || '');
  if(note === null) return;
  const url = prompt('启动地址', a.url || '');
  if(url === null) return;
  accounts[i] = {name:name.trim(), note:note.trim(), url:url.trim()};
  save();
  renderAccounts();
}

function removeAccount(i){
  if(!confirm('确定删除这个 Signal 身份吗？')) return;
  accounts.splice(i,1);
  save();
  renderAccounts();
}

function renderWebs(){
  $('#webCount').textContent = webs.length;
  const el = $('#webs');
  if(!webs.length){
    el.innerHTML = '<div class="muted">点击顶部“添加网页”开始。</div>';
    return;
  }

  el.innerHTML = webs.map((w,i) => `
    <div class="pane">
      <div class="row">
        <input id="web-${i}" value="${safe(w.url || '')}" placeholder="https://example.com">
        <button onclick="openWeb(${i})">打开</button>
      </div>
      <div class="actions">
        <button class="secondary" onclick="translateWeb(${i})">翻译网页</button>
        <button class="secondary" onclick="duplicateWeb(${i})">复制窗口</button>
        <button class="secondary" onclick="removeWeb(${i})">删除</button>
      </div>
      <div class="muted" style="margin-top:8px">
        网页使用新标签页打开，避免被 iframe / CSP 安全策略拦截。
      </div>
    </div>
  `).join('');
}

function addWeb(){
  webs.push({url:''});
  save();
  renderWebs();
}

function openWeb(i){
  const input = document.getElementById('web-' + i);
  const url = normalize(input.value);
  if(!url) return;
  webs[i].url = url;
  save();
  window.open(url, '_blank', 'noopener,noreferrer');
}

function translateWeb(i){
  const input = document.getElementById('web-' + i);
  const url = normalize(input.value);
  if(!url) return;
  webs[i].url = url;
  save();
  const target = $('#to').value;
  const trans = 'https://translate.google.com/translate?sl=auto&tl=' +
    encodeURIComponent(target) + '&u=' + encodeURIComponent(url);
  window.open(trans, '_blank', 'noopener,noreferrer');
}

function duplicateWeb(i){
  webs.splice(i + 1, 0, {url:webs[i].url || ''});
  save();
  renderWebs();
}

function removeWeb(i){
  webs.splice(i,1);
  save();
  renderWebs();
}

function translateText(){
  const text = $('#text').value.trim();
  if(!text) return;
  const sl = $('#from').value;
  const tl = $('#to').value;
  const url = 'https://translate.google.com/?sl=' +
    encodeURIComponent(sl) + '&tl=' + encodeURIComponent(tl) +
    '&text=' + encodeURIComponent(text) + '&op=translate';
  window.open(url, '_blank', 'noopener,noreferrer');
}

function swapLang(){
  const from = $('#from');
  const to = $('#to');
  if(from.value === 'auto'){
    from.value = to.value;
    to.value = 'en';
  }else{
    const tmp = from.value;
    from.value = to.value;
    to.value = tmp;
  }
}

async function copyText(){
  const text = $('#text').value;
  if(!text) return;
  try{
    await navigator.clipboard.writeText(text);
    alert('已复制');
  }catch{
    alert('浏览器不允许自动复制，请手动复制。');
  }
}

renderAccounts();
renderWebs();
</script>
</body>
</html>
